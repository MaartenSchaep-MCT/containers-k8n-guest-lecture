# Installs the kube-prometheus-stack Helm chart (Prometheus + Grafana + Alertmanager)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts   # Helm repo, not Git
    chart: kube-prometheus-stack
    targetRevision: 92.15.0
    helm:
      valuesObject:
        # Docker Desktop / k3d on Windows can't mount the host root fs; avoids node-exporter crashing
        prometheus-node-exporter:
          hostRootFsMount:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true     # create the "monitoring" namespace
      - ServerSideApply=true     # the chart's CRDs are too big for normal kubectl apply
